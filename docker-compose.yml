services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting_rooms
      POSTGRES_PASSWORD: meeting_rooms
      POSTGRES_DB: meeting_rooms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meeting_rooms']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://meeting_rooms:meeting_rooms@postgres:5432/meeting_rooms
      PORT: 3000
      TZ: UTC
      NOTIFY_BEFORE_MINUTES: 10
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:3000
    ports:
      - '5173:5173'
    depends_on:
      - server

volumes:
  postgres_data:
