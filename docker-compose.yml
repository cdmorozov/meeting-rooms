services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting_rooms
      POSTGRES_PASSWORD: meeting_rooms
      POSTGRES_DB: meeting_rooms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meeting_rooms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
